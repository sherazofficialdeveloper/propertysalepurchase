<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your EstateHub dashboard." />
  <title>Dashboard — EstateHub</title>

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/properties.css" />
  <link rel="stylesheet" href="css/manage.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/notifications.css" />
</head>
<body class="dash">

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="EstateHub home">
        <span class="brand-mark" aria-hidden="true">E</span>
        <span class="brand-name">Estate<span>Hub</span></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="primaryNav" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="primary-nav" id="primaryNav" aria-label="Primary">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="properties.html" class="nav-link">Properties</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="nav-actions"></div>
      </nav>
    </div>
  </header>

  <div class="dash-layout">
    <!-- Sidebar -->
    <aside class="dash-side" id="dashSide" aria-label="Dashboard navigation">
      <div class="dash-brand">
        <span class="brand-mark" aria-hidden="true">E</span>
        <div>
          <strong id="dashRole">Dashboard</strong>
          <div class="muted" style="font-size:var(--fs-xs);" id="dashUserName">—</div>
        </div>
      </div>
      <nav class="dash-nav" id="dashNav"></nav>
    </aside>

    <!-- Main content -->
    <main class="dash-main" id="dashMain">
      <button type="button" class="dash-menu-btn" id="dashMenuBtn" aria-label="Toggle sidebar">☰ Menu</button>
      <div class="panel"><p class="muted">Loading dashboard…</p></div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="container footer-bottom-inner">
      <p>&copy; <span id="year"></span> EstateHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state/session.js"></script>
  <script src="js/ui/navbar.js"></script>
  <script src="js/ui/share.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{const y=document.getElementById('year');if(y)y.textContent=new Date().getFullYear();});</script>
  <script src="js/notifications.js"></script>
</body>
</html>
